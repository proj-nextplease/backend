spring:
  application:
    name: nextplease-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nextplease}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost/.well-known/jwks.json}
          issuer-uri: ${SUPABASE_ISSUER:http://localhost/auth/v1}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      enabled: ${APP_SECURITY_JWT_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
