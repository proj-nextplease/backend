spring:
  application:
    name: nextplease-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nextplease}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SMTP_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost/.well-known/jwks.json}
          issuer-uri: ${SUPABASE_ISSUER:http://localhost/auth/v1}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      enabled: ${APP_SECURITY_JWT_ENABLED:false}
  auth:
    registration:
      expose-dev-otp: ${APP_AUTH_REGISTRATION_EXPOSE_DEV_OTP:false}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from-address: ${APP_MAIL_FROM_ADDRESS:no-reply@nextplease.vn}
    from-name: ${APP_MAIL_FROM_NAME:nextplease}

management:
  endpoints:
    web:
      exposure:
        include: health,info
